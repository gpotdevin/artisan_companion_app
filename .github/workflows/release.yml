name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release AAB + APK
    runs-on: ubuntu-latest

    env:
      ARTISAN_RELEASE_STORE_PASSWORD: ${{ secrets.ARTISAN_RELEASE_STORE_PASSWORD }}
      ARTISAN_RELEASE_KEY_ALIAS: ${{ secrets.ARTISAN_RELEASE_KEY_ALIAS }}
      ARTISAN_RELEASE_KEY_PASSWORD: ${{ secrets.ARTISAN_RELEASE_KEY_PASSWORD }}

    defaults:
      run:
        working-directory: mobile/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/11.0/bin:$ANDROID_HOME/cmdline-tools/10.0/bin:$ANDROID_HOME/tools/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;34.0.0" \
            "ndk;26.1.10909125" "cmake;3.22.1" --sdk_root=$ANDROID_HOME
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> local.properties

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ARTISAN_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > artisan-release.keystore
          echo "ARTISAN_RELEASE_STORE_FILE=${{ github.workspace }}/mobile/android/artisan-release.keystore" >> "$GITHUB_ENV"

      - name: Resolve version info
        run: |
          # versionName from git tag (strip leading 'v'), fallback to workflow_dispatch
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.1.0-dev"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          # versionCode from build-counter.txt
          VERSION_CODE=$(cat build-counter.txt 2>/dev/null || echo "1")
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Build release APK and AAB
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PversionName="${{ env.VERSION_NAME }}"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('reprotest-{0}', env.VERSION_CODE) || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/apk/release/app-release.apk
