[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alog_core"
version = "0.1.0"
description = "Stdlib-only reader and indexer for Artisan .alog coffee roast logs"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
