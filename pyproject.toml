[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artisan-companion"
version = "0.1.0"
description = "Offline sensory editor for Artisan .alog roast logs"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
app = ["fastapi", "uvicorn"]

[tool.setuptools.packages.find]
where = ["src"]
