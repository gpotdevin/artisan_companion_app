// Top-level build file. Plugin versions are aligned with the generic toolchain
// in ~/dev/tools (AGP 8.9.1 / Kotlin 1.9.22 / Chaquopy 16.0.0, Gradle 8.11.1 via the
// wrapper). AGP 8.9.1 is required for compileSdk 36. If Android Studio complains
// about version checks, align them with your Studio's "New Project" template
// (see the comment in app/build.gradle).
plugins {
    id("com.android.application") version "8.9.1" apply false
    id("org.jetbrains.kotlin.android") version "1.9.22" apply false
    id("org.jetbrains.kotlin.plugin.serialization") version "1.9.22" apply false
    id("com.chaquo.python") version "16.0.0" apply false
}
