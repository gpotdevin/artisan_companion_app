plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("org.jetbrains.kotlin.plugin.serialization")
    id("com.chaquo.python")
}

android {
    namespace = "com.artisancompanion"
    compileSdk = 34

    // versionCode is read from build-counter.txt to ensure a monotonically
    // increasing integer for Play Store uploads (same pattern as runBeat).
    def counterFile = file("${project.rootDir}/build-counter.txt")
    def buildNumber = counterFile.exists() ? counterFile.text.trim().toInteger() : 1
    // versionName can be overridden from CI via -PversionName=<tag-version>
    def vName = project.findProperty('versionName') ?: '0.1.0'

    defaultConfig {
        applicationId = "com.artisancompanion"
        minSdk = 24
        targetSdk = 34
        versionCode = buildNumber
        versionName = vName

        // Chaquopy requires explicit ABI filters: it packages the embedded
        // CPython runtime per ABI. arm64-v8a = phones, x86_64 = emulator.
        // Add "armeabi-v7a"/"x86" here if you need 32-bit devices.
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        release {
            // Signing secrets come from environment variables only (no secrets in the repo).
            // Set these via CI/CD or local environment:
            // ARTISAN_RELEASE_STORE_FILE, ARTISAN_RELEASE_STORE_PASSWORD,
            // ARTISAN_RELEASE_KEY_ALIAS, ARTISAN_RELEASE_KEY_PASSWORD
            storeFile file(System.getenv('ARTISAN_RELEASE_STORE_FILE') ?: '../../../../ArtisanCompanion.keystore')
            storePassword System.getenv('ARTISAN_RELEASE_STORE_PASSWORD')
            keyAlias System.getenv('ARTISAN_RELEASE_KEY_ALIAS') ?: 'ArtisanCompanion_app'
            keyPassword System.getenv('ARTISAN_RELEASE_KEY_PASSWORD')
        }
    }

    buildFeatures {
        compose = true
    }
    composeOptions {
        // Compose Compiler 1.5.8 <-> Kotlin 1.9.22 (official compatibility table).
        kotlinCompilerExtensionVersion = "1.5.8"
    }

    // Single-source the Python core from the repo's src/ (alog_core, store,
    // sync, app). Only the Android facade (api.py) lives in the Gradle project.
    // The core is stdlib-only, so Chaquopy needs no pip installs.
    sourceSets {
        getByName("main") {
            python.srcDir("src/main/python")
            python.srcDir("../../../src")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // Enable desugaring so java.time (LocalDate, YearMonth, etc.) works on
        // API 24-25 (minSdk = 24). Without this, the app crashes with
        // NoClassDefFoundError on Android 7.x when using java.time APIs.
        isCoreLibraryDesugaringEnabled = true
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("com.google.android.material:material:1.11.0")
    implementation("androidx.activity:activity-compose:1.8.0")
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2")
    implementation("androidx.navigation:navigation-compose:2.7.4")

    // Individual Compose versions (no BOM), aligned with the generic toolchain
    // in ~/dev/tools/gradle. ui-graphics/foundation/runtime arrive transitively
    // via ui/material3.
    implementation("androidx.compose.ui:ui:1.5.3")
    implementation("androidx.compose.ui:ui-tooling-preview:1.5.3")
    implementation("androidx.compose.material3:material3:1.1.2")
    implementation("androidx.compose.material:material-icons-extended:1.5.3")

    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3")

    // Core library desugaring: provides java.time backport for API 24-25.
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")

    debugImplementation("androidx.compose.ui:ui-tooling:1.5.3")
}
